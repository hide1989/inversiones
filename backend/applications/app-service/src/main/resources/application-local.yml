spring:
  datasource:
    # Development defaults only. The url's shape lives in application.yml; these two lines supply
    # the values that application.yml deliberately leaves without one, so `./gradlew bootRun` and
    # the dev compose stack need no setup step.
    #
    # POSTGRES_PORT stays overridable and matters on this machine: the dev compose maps Postgres to
    # 5433 because an unrelated container holds 5432, so `POSTGRES_PORT=5433 ./gradlew bootRun` is
    # the working invocation. Note that a Gradle daemon started before that variable existed will
    # not see it — use --no-daemon, or stop the daemon, if it appears not to take effect.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:inversiones}
    password: ${POSTGRES_PASSWORD:inversiones_local}

inversiones:
  security:
    # Local-only default so `./gradlew bootRun` and the composed stack need no manual setup step.
    # This value is intentionally public (it is committed to this repository); JwtCodecConfig
    # refuses to accept it outside the "local" profile, so it can never become a real signing key.
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-32bytes}
    # The Vite dev server Plan 3 runs. Local-only, like the secret above: the base file now
    # requires this variable so a deployed instance cannot inherit a developer's origin.
    allowed-origins: ${SECURITY_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    co.com.david.inversiones: DEBUG
