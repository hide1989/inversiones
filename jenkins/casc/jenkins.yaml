# Jenkins Configuration as Code: everything Jenkins needs to run this project's pipeline, with no
# manual setup step. Secrets are read from the environment, never written here.
jenkins:
  systemMessage: "Inversiones CI — configured as code from jenkins/casc/jenkins.yaml"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  # WITHOUT THIS BLOCK JENKINS IS WIDE OPEN. A securityRealm only decides who *can* log in; with
  # no authorizationStrategy, Jenkins keeps its default AuthorizationStrategy.Unsecured, under
  # which every anonymous caller is an administrator and the admin password above protects nothing.
  #
  # This file shipped without it. An earlier version declared `loggedInAuthorizationStrategy`,
  # which is not a JCasC key — JCasC refused to boot, the key was removed to get the container up,
  # and the correct spelling below was never put in its place. Measured on the running container
  # with no credentials at all: GET /credentials/ returned 200, and POST /scriptText with an
  # anonymous crumb executed Groovy and returned its output. That container mounts
  # /var/run/docker.sock, so it was remote code execution against the Docker daemon that also runs
  # n8n — this application's only data source.
  #
  # Worth recording how it was nearly missed twice: an unauthenticated POST to /scriptText answers
  # 403, which reads exactly like authorization working. That is the CSRF crumb check, and Jenkins
  # hands a crumb to anonymous callers for the asking.
  #
  # allowAnonymousRead stays false: with it true, build consoles and job config are world-readable,
  # and this project's consoles carry environment values.
  #
  # jenkins/__tests__/jenkins-security.sh asserts all of this, in the file and on the wire.
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8090/"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Placeholders so a `local` deploy works out of the box. A withCredentials block fails
          # the build when its credential id does not exist AT ALL, so declaring all five here
          # means choosing `vps` fails on the real missing thing — the account behind it — rather
          # than on a missing credential id.
          - string:
              scope: GLOBAL
              id: "inversiones-jwt-secret"
              secret: "${JWT_SECRET_CI:-ci-placeholder-secret-at-least-32-bytes}"
              description: "JWT signing secret used by the deploy stages"
          - string:
              scope: GLOBAL
              id: "inversiones-postgres-password"
              secret: "${POSTGRES_PASSWORD_CI:-inversiones_local}"
              description: "Postgres password used by the deploy stages"
          - string:
              scope: GLOBAL
              id: "inversiones-backend-host"
              secret: "${BACKEND_HOST_CI:-api.srv1449561.hstgr.cloud}"
              description: "Hostname Traefik routes to the backend. Only the vps target reads it."
          - string:
              scope: GLOBAL
              id: "inversiones-allowed-origins"
              secret: "${ALLOWED_ORIGINS_CI:-https://replace-me.vercel.app}"
              description: "Exact origin of the deployed frontend, no wildcard. Only vps reads it."
          - string:
              scope: GLOBAL
              id: "vercel-token"
              secret: "${VERCEL_TOKEN_CI:-replace-me-no-vercel-account-yet}"
              description: "Vercel deploy token. No account exists yet; see docs/runbook-vps.md"

jobs:
  - script: |
      pipelineJob('inversiones') {
        description('Build, test and deploy the inversiones project. The deploy target is a parameter.')
        parameters {
          choiceParam('DEPLOY_TARGET', ['none', 'local', 'vps'],
            'none: build and test only. local: compose up on this host. vps: remote Docker over SSH.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url(System.getenv('INVERSIONES_REPO_URL')) }
                branch(System.getenv('INVERSIONES_BRANCH'))
                extensions {}
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
        // Polling, not a webhook: a laptop has no public IP for GitHub to reach, and this job's
        // SCM is a local path anyway. The VPS phase replaces this with a real webhook — see
        // docs/runbook-vps.md.
        triggers {
          scm('H/15 * * * *')
        }
      }
