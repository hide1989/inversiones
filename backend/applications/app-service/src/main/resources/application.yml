server:
  port: 8080
spring:
  application:
    name: inversiones
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  devtools:
    add-properties: false
  # TODO(task 4): remove once the driven adapters implement the domain gateways.
  # UseCasesConfig component-scans every *UseCase class into a Spring bean; with
  # no gateway adapter beans yet, eager instantiation fails context refresh with
  # UnsatisfiedDependencyException. Lazy init defers that until first real use.
  main:
    lazy-initialization: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Sample rest-consumer/circuit-breaker/CORS wiring left by the clean-architecture
# scaffold. Task 4 replaces the sample RestConsumer and ApiRest classes that
# consume these; the settings stay so the scaffold-generated code keeps working
# until then. Every value reads an environment variable with a local default.
adapter:
  restconsumer:
    url: ${RESTCONSUMER_URL:http://localhost:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s

inversiones:
  base-trm: ${BASE_TRM:3568.42}
  n8n:
    base-url: ${N8N_BASE_URL:https://n8n.srv1449561.hstgr.cloud/webhook/inv}
    connect-timeout: 5s
    read-timeout: 30s
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-32bytes}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
