apply plugin: 'info.solidsoft.pitest.aggregator'

allprojects {
    repositories {
        //mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'info.solidsoft.pitest'

    compileJava.dependsOn validateStructure

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    //build.dependsOn 'pitest'

    test {
        useJUnitPlatform()
    }

    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")
        pitest "org.pitest:pitest-history-plugin:${pitestHistoryVersion}"
        testImplementation 'org.assertj:assertj-core'
        testImplementation 'org.mockito:mockito-core'
        testImplementation 'org.mockito:mockito-junit-jupiter'
    }


    test.finalizedBy(project.tasks.jacocoTestReport)

    pitest {
        targetClasses = ['co.com.david.inversiones.*']
        excludedClasses = []
        excludedTestClasses = []
        pitestVersion = '1.30.0'
        verbose = false
        outputFormats = ['XML', 'HTML']
        threads = Runtime.runtime.availableProcessors()
        exportLineCoverage = true
        useClasspathFile = true
        withHistory = true
        timestampedReports = false
        //mutators = ['STRONGER', 'DEFAULTS']
        fileExtensionsToFilter.addAll('xml', 'orbit')
        junit5PluginVersion = '1.2.3'
        failWhenNoMutations = false
        jvmArgs = ["-XX:+AllowRedefinitionToAddDeleteMethods"]
    }

    jacocoTestReport {
        // 'pitest' is deliberately not a dependency here either. This per-module coupling is the
        // second half of the same mistake as jacocoMergedReport's: with `test.finalizedBy(
        // jacocoTestReport)` on line 45, every module's test run pulled mutation analysis in
        // behind it. Removing only the aggregate dependency was not enough — PIT still ran 41
        // times in CI and the agent was still OOM-killed, which is how this one was found.
        dependsOn test
        reports {
            xml.setRequired true
            xml.setOutputLocation layout.buildDirectory.file("reports/jacoco.xml")
            csv.setRequired false
            html.setOutputLocation layout.buildDirectory.dir("reports/jacocoHtml")
        }
    }

}

jacoco {
    toolVersion = "${jacocoVersion}"
    reportsDirectory.set(layout.buildDirectory.dir("reports"))
}

tasks.register('jacocoMergedReport', JacocoReport) {
    // pitestReportAggregate is deliberately NOT a dependency. A line-coverage report has no reason
    // to require mutation analysis, and that coupling was the single cause of three separate
    // problems, since `check` depends on jacocoMergedCoverageVerification which depends on this:
    //
    //   1. `./gradlew build` could not use Gradle's configuration cache at all — the PIT plugin's
    //      AggregateReportTask cannot be serialised ("error writing value of type
    //      DefaultConfigurableFileCollection"), so every build needed --no-configuration-cache.
    //   2. The CI agent was OOM-killed twice, at 2 GB and again at 4 GB. PIT forks a JVM per
    //      mutation unit and each sizes its heap from the container limit, so raising the limit
    //      enlarges the children too and never converges.
    //   3. Every `build` paid 13 minutes for mutation analysis that gates nothing: there is no
    //      mutationThreshold configured, so PIT produces a report and the build passes regardless.
    //
    // PIT remains available on its own: `./gradlew pitest` per module, or `pitestReportAggregate`
    // for the merged report. Run it deliberately, or on a schedule, rather than on every build.
    dependsOn = [test, subprojects.jacocoTestReport]
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.sourceSets.main.output)
    executionData.setFrom project.fileTree(dir: '.', include: '**/build/jacoco/test.exec')
    reports {
        xml.setRequired true
        csv.setRequired false
        html.setRequired true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

pitestReportAggregate {
    def rootReportDir = layout.buildDirectory.dir("reports/pitest")
    def subprojectReports = subprojects.collect { subproject ->
        subproject.layout.buildDirectory.file("reports/pitest/mutations.xml")
    }

    doLast {
        def reportDir = rootReportDir.get().asFile
        def consolidatedReport = new File(reportDir, 'mutations.xml')
        consolidatedReport.withWriter { writer ->
            writer.write("<mutations>\n")
            subprojectReports.each { reportProvider ->
                def xmlReport = reportProvider.get().asFile
                if (xmlReport.exists()) {
                    def xmlContent = xmlReport.text
                    xmlContent = xmlContent.replaceAll("<\\?xml[^>]*>", "")
                    xmlContent = xmlContent.replaceAll("</?mutations( partial=\"true\")?>", "")
                    writer.write(xmlContent.trim() + "\n")
                }
            }
            writer.write("</mutations>")
        }
    }
}

tasks.register('jacocoMergedCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoMergedReport'
    additionalSourceDirs.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    sourceDirectories.setFrom files(subprojects.sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom files(subprojects.collectMany { subproject ->
        subproject.sourceSets.main.output.classesDirs.files.collect { dir ->
            fileTree(dir: dir, exclude: [
                    '**/config/**',
                    '**/MainApplication*',
                    '**/*Application*'
            ])
        }
    })
    executionData.setFrom project.fileTree(dir: '.', include: '**/build/jacoco/test.exec')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn 'jacocoMergedCoverageVerification'

tasks.named('wrapper') {
    gradleVersion = '9.7.1'
}
