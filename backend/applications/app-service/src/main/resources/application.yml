server:
  port: 8080
spring:
  application:
    name: inversiones
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  devtools:
    add-properties: false
  datasource:
    # The connection lives here, not in a profile, so every profile can connect.
    # application-local.yml supplies the development defaults by overriding only what differs.
    #
    # Placing this in the profile instead left any non-local profile with NO datasource at all, so
    # the failure surfaced wherever Hikari or Flyway first asked for a connection rather than at the
    # configuration that was missing.
    #
    # POSTGRES_HOST and POSTGRES_PASSWORD deliberately carry no default: a deployment that forgets
    # either must fail at startup rather than quietly target localhost with a guessable password.
    # POSTGRES_PORT and POSTGRES_DB do have defaults, because the standard port and the database
    # name are not secrets and getting them wrong fails loudly on connect.
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:inversiones}
    username: ${POSTGRES_USER:inversiones}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Sample rest-consumer/circuit-breaker wiring left by the clean-architecture
# scaffold. Task 4 replaces the sample RestConsumer and ApiRest classes that
# consume these; the settings stay so the scaffold-generated code keeps working
# until then. Every value reads an environment variable with a local default.
adapter:
  restconsumer:
    url: ${RESTCONSUMER_URL:http://localhost:8080}

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 10s
      # One instance per n8n endpoint group (Task 6), so a flaky /stocktwits does not
      # trip the breaker guarding /precios-hoy. Shared defaults; tune per-endpoint if a
      # workflow proves noisier than the rest.
      trm: &n8nCircuitBreakerDefaults
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 4s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
      precios-hoy: *n8nCircuitBreakerDefaults
      bvc-precios: *n8nCircuitBreakerDefaults
      indicadores-tecnicos: *n8nCircuitBreakerDefaults
      news-sentiment: *n8nCircuitBreakerDefaults
      ratings-analistas: *n8nCircuitBreakerDefaults
      insider-trading: *n8nCircuitBreakerDefaults
      stocktwits: *n8nCircuitBreakerDefaults
      reddit: *n8nCircuitBreakerDefaults
      # Task 7: four more pass-through endpoints. sintesis-ia gets its own slow-call threshold
      # because it can legitimately take ~55s on a cold call upstream (normally served from n8n's
      # own cache); the shared 4s default would misclassify that as a slow call. It is now backed
      # by its own RestClient with a 90s read timeout (inversiones.n8n.slow-read-timeout), so 70s
      # sits with margin above the documented ~55s cold-start ceiling (no false "slow" verdict on a
      # normal cold call) while still being comfortably under the 90s hard timeout, so a call that
      # is genuinely degraded (stuck well past a normal cold start) gets flagged as slow before the
      # breaker would otherwise just wait out the full 90s for a timeout exception.
      sintesis-ia:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 70s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
      earnings: *n8nCircuitBreakerDefaults
      watchlist: *n8nCircuitBreakerDefaults
      analizar-empresa: *n8nCircuitBreakerDefaults
      etf-ficha: *n8nCircuitBreakerDefaults
  retry:
    instances:
      n8nDefaults: &n8nRetryDefaults
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.RestClientException
          - com.fasterxml.jackson.core.JsonProcessingException
      trm: *n8nRetryDefaults
      precios-hoy: *n8nRetryDefaults
      bvc-precios: *n8nRetryDefaults
      indicadores-tecnicos: *n8nRetryDefaults
      news-sentiment: *n8nRetryDefaults
      ratings-analistas: *n8nRetryDefaults
      insider-trading: *n8nRetryDefaults
      stocktwits: *n8nRetryDefaults
      reddit: *n8nRetryDefaults
      sintesis-ia: *n8nRetryDefaults
      earnings: *n8nRetryDefaults
      watchlist: *n8nRetryDefaults
      analizar-empresa: *n8nRetryDefaults
      etf-ficha: *n8nRetryDefaults

inversiones:
  base-trm: ${BASE_TRM:3568.42}
  # RefreshSignalSnapshotUseCase's schedule (Task 10): 10:15 America/Bogota, Monday to Friday, once
  # the upstream n8n workflows have refreshed for the day. Both fields are also defaulted inline on
  # the @Scheduled annotation, so a missing property here still falls back to the same schedule.
  signal-snapshot:
    refresh-cron: ${SIGNAL_SNAPSHOT_REFRESH_CRON:0 15 10 * * MON-FRI}
    refresh-zone: ${SIGNAL_SNAPSHOT_REFRESH_ZONE:America/Bogota}
  n8n:
    base-url: ${N8N_BASE_URL:https://n8n.srv1449561.hstgr.cloud/webhook/inv}
    connect-timeout: 5s
    read-timeout: 30s
    slow-read-timeout: ${N8N_SLOW_READ_TIMEOUT:90s}
  security:
    # No default here, deliberately: a default visible to every profile is a default a real
    # deployment can boot on without ever being asked to set JWT_SECRET. The local-only default
    # lives in application-local.yml instead, so any profile other than "local" fails fast at
    # context startup ("Could not resolve placeholder 'JWT_SECRET'") rather than silently signing
    # tokens with a value published in this repository. JwtCodecConfig additionally rejects that
    # exact committed value outright if it is ever copy-pasted into JWT_SECRET for a non-local
    # profile, so even an explicit misconfiguration cannot pass the check.
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    # Exact origins allowed to call this API cross-origin; no wildcard. Defaults to the Vite dev
    # server Plan 3 runs.
    allowed-origins: ${SECURITY_ALLOWED_ORIGINS:http://localhost:5173}
