name: inversiones-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: inversiones-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inversiones}
      POSTGRES_USER: ${POSTGRES_USER:-inversiones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inversiones_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inversiones} -d ${POSTGRES_DB:-inversiones}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # The image NAME matters, and its absence here cost this project seven weeks of acceptance
    # evidence. With only a `build:` section, Compose names the image after the project
    # (inversiones-dev-backend:latest) — a name the Docker Build stage never produces — and
    # `docker compose up` builds only when the image is ABSENT, never when it is stale. So CI
    # built inversiones-backend:<sha> and then tested a container from an image dated 2026-10-08.
    #
    # Naming it explicitly makes the pipeline reuse exactly what it just built: Jenkins sets
    # IMAGE_TAG to the commit sha, so this resolves to the image the Docker Build stage tagged.
    # Locally IMAGE_TAG is unset and this is inversiones-backend:dev, built on first use — so run
    # `docker compose -f deploy/docker-compose.dev.yml up -d --build` after changing backend code,
    # because compose will NOT notice the source changed.
    #
    # scripts/assert-backend-image.sh is what keeps this honest; the pipeline calls it after
    # every `up`, so a container from the wrong image fails the build instead of passing it.
    image: inversiones-backend:${IMAGE_TAG:-dev}
    build:
      context: ../backend
      dockerfile: deployment/Dockerfile
    container_name: inversiones-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Inside the compose network "localhost" resolves to this container, not the postgres
      # container, so POSTGRES_HOST must be the service name here. application-local.yml still
      # defaults POSTGRES_HOST to localhost, which is the right default for `bootRun` on the host.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-inversiones}
      POSTGRES_USER: ${POSTGRES_USER:-inversiones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inversiones_local}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32bytes}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:-http://localhost:5173}
      N8N_BASE_URL: ${N8N_BASE_URL:-https://n8n.srv1449561.hstgr.cloud/webhook/inv}
      N8N_SLOW_READ_TIMEOUT: ${N8N_SLOW_READ_TIMEOUT:-90s}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
